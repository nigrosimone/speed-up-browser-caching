name: Prepara rilascio

# Passo 1 di 2 del rilascio (variante "con PR"):
# questo workflow prepara le modifiche e apre una Pull Request.
# Il rilascio vero parte da solo al merge, tramite release.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nuova versione (X.Y.Z)'
        required: true
        type: string
      tested_up_to:
        description: 'Tested up to (lascia vuoto per non cambiarlo)'
        required: false
        type: string
        default: ''
      changelog:
        description: 'Voci del changelog, separate da ";"'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Bump versione e apri PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Aggiorna readme.txt e header del plugin
        run: |
          php bin/bump-version.php \
            --version="${{ inputs.version }}" \
            --tested-up-to="${{ inputs.tested_up_to }}" \
            --changelog="${{ inputs.changelog }}"

      - name: Verifica coerenza del risultato
        run: php bin/check-version.php "${{ inputs.version }}"

      - name: Apri la Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/v${{ inputs.version }}
          delete-branch: true
          commit-message: "Release ${{ inputs.version }}"
          title: "Release ${{ inputs.version }}"
          body: |
            Rilascio della versione **${{ inputs.version }}**.

            | | |
            |---|---|
            | Versione | `${{ inputs.version }}` |
            | Tested up to | `${{ inputs.tested_up_to }}` |

            **Changelog**
            ```
            ${{ inputs.changelog }}
            ```

            Controlla il diff qui sotto. **Al merge di questa PR** il plugin viene
            taggato `v${{ inputs.version }}` e pubblicato automaticamente su
            wordpress.org: non serve nessun altro intervento manuale.
          labels: release
