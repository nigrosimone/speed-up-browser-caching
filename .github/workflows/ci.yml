name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # BLOCCANTI: se falliscono, la PR non si merga.
  # ---------------------------------------------------------------------------

  lint:
    name: Sintassi PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: php -l su tutti i file pubblicati
        run: php bin/lint.php

  compat:
    name: Compatibilita PHP 7.0+
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v3

      # Analisi statica: copre anche 7.0 e 7.1, che non sono nella matrice runtime.
      - name: PHPCompatibilityWP
        run: composer compat

  versions:
    name: Coerenza versioni
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # Version: nell'header == Stable tag nel readme, e changelog presente.
      - name: Verifica header, Stable tag e changelog
        run: php bin/check-version.php

  test:
    name: Test PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: PHPUnit
        run: vendor/bin/phpunit

  # ---------------------------------------------------------------------------
  # INFORMATIVI: mostrano il debito da smaltire senza bloccare il lavoro.
  # Da promuovere a bloccanti quando il conteggio arriva a zero.
  # ---------------------------------------------------------------------------

  coding-standards:
    name: WordPress Coding Standards (informativo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v3

      # Il job resta verde di proposito: il conteggio finisce nel riepilogo della
      # run, cosi' il debito e' visibile senza che la CI sia perennemente rossa
      # (una CI sempre rossa smette di essere un segnale). Diventera' bloccante
      # quando il conteggio arrivera' a zero.
      - name: PHPCS
        run: |
          set +e
          vendor/bin/phpcs --report=full --report-summary --no-colors | tee phpcs-report.txt
          set -e

          {
            echo "### WordPress Coding Standards"
            echo
            grep -E "^A TOTAL OF" phpcs-report.txt || echo "Nessuna violazione."
            echo
            echo "<details><summary>Rapporto completo</summary>"
            echo
            echo '```'
            head -c 60000 phpcs-report.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  plugin-check:
    name: WordPress Plugin Check (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Il controllo va fatto sul pacchetto che riceve l'utente, non sul repo:
      # altrimenti segnala file di sviluppo (.gitignore, phpunit.xml.dist, .github)
      # che .distignore esclude gia' dalla pubblicazione.
      - name: Ricostruisci il pacchetto pubblicato
        run: bash bin/build-dist.sh build

      # Stessi controlli usati dal team review di wordpress.org.
      #
      # ignore-codes elenca i rilievi noti e consapevolmente accettati. Senza
      # questo elenco il job resterebbe rosso per sempre e smetterebbe di essere
      # un segnale: cosi' invece e' verde, e se diventa rosso e' comparso
      # qualcosa di NUOVO. Ogni voce va tolta da qui quando viene risolta.
      #
      # Tutti i codici sotto riguardano la stessa cosa: il plugin manipola il
      # .htaccess con le funzioni native di PHP invece che con WP_Filesystem.
      # E' l'implementazione originale, in produzione dal 2016. Migrare a
      # WP_Filesystem e' un refactor a se' stante, non una correzione.
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build'
          # Su una riga sola e senza spazi: l'action espande questo valore in shell
          # senza quote, quindi newline o spazi lo spezzerebbero in piu' argomenti.
          ignore-codes: 'WordPress.WP.AlternativeFunctions.file_system_operations_fopen,WordPress.WP.AlternativeFunctions.file_system_operations_fwrite,WordPress.WP.AlternativeFunctions.file_system_operations_fclose,WordPress.WP.AlternativeFunctions.file_system_operations_is_writable,WordPress.WP.AlternativeFunctions.rename_rename,PluginCheck.CodeAnalysis.WriteFile.ABSPATHDetected'
