name: CI

# La logica sta in nigrosimone/wp-plugin-ci, condivisa da tutti i plugin.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: nigrosimone/wp-plugin-ci/.github/workflows/plugin-ci.yml@v1
    with:
      min-php: '7.0-'
      # Rilievi noti e consapevolmente accettati: il plugin manipola il .htaccess
      # con le funzioni native di PHP invece che con WP_Filesystem. E'
      # l'implementazione originale, in produzione dal 2016, e migrarla e' un
      # refactor a se' stante. Su una riga sola e senza spazi: l'action espande
      # questo valore in shell senza quote.
      #
      # Lo stesso elenco e' escluso in phpcs.xml.dist: le due liste vanno tenute
      # allineate, e ogni voce va tolta da entrambe quando viene risolta.
      plugin-check-ignore-codes: 'WordPress.WP.AlternativeFunctions.file_system_operations_fopen,WordPress.WP.AlternativeFunctions.file_system_operations_fwrite,WordPress.WP.AlternativeFunctions.file_system_operations_fclose,WordPress.WP.AlternativeFunctions.file_system_operations_is_writable,WordPress.WP.AlternativeFunctions.rename_rename,PluginCheck.CodeAnalysis.WriteFile.ABSPATHDetected'
